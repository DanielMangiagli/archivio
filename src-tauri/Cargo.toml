[package]
name = "archivio"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
open = "5"
rfd = "0.15"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
kamadak-exif = "0.5"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
